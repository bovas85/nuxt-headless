version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: nuxt_headless_wp_db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.2-apache
    container_name: nuxt_headless_wp
    restart: always
    ports:
      - '8080:80'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./themes/moustache:/var/www/html/wp-content/themes/moustache
      - ./plugins/moustache:/var/www/html/wp-content/plugins/moustache

volumes:
  db_data:
