name: Errors to Issues

on:
  workflow_run:
    workflows:
      - "CI"
    types: [completed]

permissions:
  issues: write

jobs:
  errors-to-issues:
    name: Errors to Issues
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: File deduped prioritized issue for failed main run
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const wfName = run.name || "Workflow";
            const runUrl = run.html_url;
            const marker = `errors-to-issues:${wfName}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });

            const existing = openIssues.find(
              (i) =>
                !i.pull_request &&
                ((i.body && i.body.includes(marker)) ||
                  i.title === `fix(ci): ${wfName} failed on main`),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurring failure on \`main\`: ${runUrl} (commit \`${run.head_sha.slice(0, 7)}\`).`,
              });
            } else {
              const priority = wfName.includes("Deploy") ? "P0" : "P1";
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `fix(ci): ${wfName} failed on main`,
                labels: [priority, "agent-ready", "two-way-door", "complexity:moderate"],
                body: [
                  `<!-- ${marker} -->`,
                  `## Failure Summary`,
                  `- **Workflow:** ${wfName}`,
                  `- **Run:** ${runUrl}`,
                  `- **Commit:** \`${run.head_sha}\``,
                  ``,
                  `## Repro`,
                  `Inspect workflow logs at ${runUrl} and reproduce locally with \`yarn verify\`.`,
                ].join("\n"),
              });
            }
