name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Issue Triage
        uses: actions/github-script@v7
        with:
          script: |
            const triage = require("./.github/scripts/issue-triage.cjs");
            await triage({
              github,
              context,
              core,
              verifyCommand: "yarn verify",
              owner: "bovas85",
            });
